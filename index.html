<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d20">
<title>X vs O — МИФ BATTLE</title>
<style>
:root{color-scheme:dark;--bg:#080d20;--panel:#10182e;--line:#26304c;--ink:#f3f6ff;--muted:#a0adc9;--cyan:#37ddff;--red:#ff5277;--lime:#b9f87a;--radius:24px;font-family:Arial,'Helvetica Neue',sans-serif;font-size:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100svh}
button,input{font:inherit}
button,a,input{-webkit-tap-highlight-color:transparent}
button,a{touch-action:manipulation}
button{cursor:pointer;color:inherit;border:1px solid var(--line);background:#172039;border-radius:12px;padding:13px 20px;min-height:48px;font-weight:700;transition:transform .18s,background .18s,box-shadow .18s}
button:disabled{cursor:default;opacity:.35}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:5px}
button:hover:not(:disabled){background:#233251;transform:translateY(-2px)}
button:active:not(:disabled){transform:translateY(0)}
a{color:inherit;text-decoration:none}
.ambient{position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(ellipse at 18% 20%,#123b643b,transparent 45%),radial-gradient(ellipse at 91% 80%,#611b4a38,transparent 45%),linear-gradient(#ffffff03 1px,transparent 1px),linear-gradient(90deg,#ffffff03 1px,transparent 1px);background-size:auto,auto,72px 72px,72px 72px}
.primary{color:#051322;background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 28px #37ddff24}
.primary:hover:not(:disabled){background:#8eeeff;box-shadow:0 0 40px #37ddff40}
.ghost{background:transparent}
.danger{color:#ff91a8;border-color:#ff527744}
.good{background:#b9f87a;color:#11251b;border-color:#b9f87a}
.bad{background:#ff52771a;border-color:#ff527755;color:#ff91a8}
.small{font-size:.88rem;padding:9px 13px;min-height:40px}
.cyan{color:var(--cyan)}
.red{color:var(--red)}
.muted{color:var(--muted)}
.eyebrow{font-size:.76rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:50px;padding:9px 14px;font-size:.78rem;letter-spacing:.04em;background:#10182eb3}
.live-dot{width:7px;height:7px;background:var(--lime);border-radius:50%;box-shadow:0 0 12px #b9f87866}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:26px 40px;border-bottom:1px solid #26304c80}
.brand{display:flex;align-items:center;gap:14px;font-size:1rem;font-weight:800;letter-spacing:.03em}
.brand .mark{font-size:1.8rem;letter-spacing:-.15em;padding-right:8px}
.brand small{display:block;color:var(--muted);font-size:.65rem;letter-spacing:.19em;margin-top:4px}
.top-actions{display:flex;gap:10px;align-items:center}
.landing{max-width:1400px;margin:auto;min-height:calc(100svh - 97px);padding:35px 5vw 25px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;overflow:hidden}
.landing .pill{margin-top:4px}
.hero-symbols{display:flex;align-items:center;justify-content:center;gap:clamp(20px,5vw,80px);height:clamp(175px,28vh,320px);margin:18px 0 0}
.hero-x,.hero-o{font-size:clamp(145px,21vw,280px);line-height:1;font-weight:900;display:block}
.hero-x{color:var(--cyan);text-shadow:0 0 50px #37ddff50;transform:rotate(-8deg)}
.hero-o{color:transparent;-webkit-text-stroke:clamp(5px,.7vw,9px) var(--red);text-shadow:0 0 65px #ff527730;transform:rotate(8deg)}
.versus{font-size:1.3rem;color:var(--muted);font-style:italic;border:1px solid #34415e;border-radius:50%;width:58px;height:58px;display:grid;place-items:center}
.landing h1{font-size:clamp(2.8rem,6vw,5rem);letter-spacing:-.05em;line-height:1;margin:12px 0 18px}
.landing h1 em{font-style:normal;color:var(--cyan)}
.landing .subtitle{font-size:clamp(.85rem,1.6vw,1.15rem);color:var(--muted);letter-spacing:.08em}
.hero-start{font-size:1rem;letter-spacing:.06em;padding:20px 42px;min-width:300px;margin:26px 0 18px}
.mode-links{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.mode-links button{font-size:.72rem;letter-spacing:.05em}
.hero-foot{display:flex;margin-top:35px;border-top:1px solid var(--line);padding-top:20px;width:min(700px,100%);justify-content:space-around}
.hero-foot div{font-size:.8rem;color:var(--muted);line-height:1.8}
.hero-foot b{display:block;color:var(--ink);font-size:1rem}
.page{max-width:1480px;margin:auto;padding:24px 36px 30px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:0 0 22px}
.page-head h1{font-size:1.7rem;margin:8px 0}
.page-head p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.6}
.setup{max-width:930px;margin:40px auto}
.setup h1{font-size:clamp(2rem,5vw,3.3rem);letter-spacing:-.04em}
.setup>p{color:var(--muted);line-height:1.7}
.teams-form{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:30px 0}
.team-form{border:1px solid #37ddff50;background:linear-gradient(145deg,#12364c88,#10182e);padding:30px;border-radius:var(--radius)}
.team-form.o{border-color:#ff527750;background:linear-gradient(145deg,#471b3788,#10182e)}
.team-form .big-symbol{font-size:5rem;font-weight:900;margin-bottom:25px;color:var(--cyan)}
.team-form.o .big-symbol{color:var(--red)}
label{display:block;font-size:.84rem;color:var(--muted);margin-bottom:12px}
input{width:100%;background:#080d2080;border:1px solid #34415e;color:var(--ink);border-radius:10px;padding:16px;font-size:1.1rem}
.rules{border-left:2px solid var(--cyan);padding:0 0 0 18px;color:var(--muted);font-size:.88rem;line-height:1.8;margin:28px 0}
.setup-bottom{display:flex;justify-content:space-between;gap:16px;align-items:center}
.setup-bottom span{font-size:.78rem;color:var(--muted)}
.host-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px}
.arena{background:linear-gradient(150deg,#101c3288,#101428aa);border:1px solid var(--line);border-radius:var(--radius);padding:24px;min-width:0;position:relative;overflow:hidden}
.arena::before{content:'';position:absolute;width:35%;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);top:0;left:10%}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center}
.team-card{display:flex;align-items:center;gap:14px;min-width:0}
.team-card.o{flex-direction:row-reverse;text-align:right}
.team-icon{font-size:2.5rem;font-weight:900;color:var(--cyan);line-height:1}
.team-card.o .team-icon{color:var(--red)}
.team-name{font-size:.9rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.team-sub{color:var(--muted);font-size:.7rem;margin-top:6px}
.score{font-size:2.2rem;font-weight:900;letter-spacing:.12em;white-space:nowrap}
.score span{color:#46516e;font-size:1.3rem;margin:0 5px}
.session{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.session strong{font-variant-numeric:tabular-nums;color:var(--ink);font-size:1.15rem}
.arena-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}
.arena-top .eyebrow{font-size:.65rem}
.turn-banner{text-align:center;font-size:.8rem;color:var(--muted);margin:22px 0 16px;min-height:22px}
.turn-banner b{color:var(--cyan)}
.turn-banner.o b{color:var(--red)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(100%,430px);margin:0 auto}
.cell{aspect-ratio:1;min-height:0;border-radius:18px;border:1px solid #303c5a;background:linear-gradient(140deg,#1d2942,#121b30);padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative}
.cell .cell-number{font-size:2.4rem;font-weight:700;color:#8594b8;line-height:1}
.cell .subject{font-size:.6rem;letter-spacing:.01em;color:#8c9ab9}
.cell:hover:not(:disabled){border-color:var(--cyan);background:#20344c;box-shadow:inset 0 0 35px #37ddff0c}
.cell.taken{opacity:1;cursor:default}
.cell .sign{font-size:4.6rem;font-weight:900;line-height:1;color:var(--cyan);text-shadow:0 0 24px #37ddff55;animation:stamp .35s ease-out}
.cell.o .sign{color:var(--red);text-shadow:0 0 24px #ff527755}
.cell.win{border-color:var(--lime);box-shadow:0 0 22px #b9f87a2e;background:#244034}
.board-footer{margin-top:22px;display:flex;justify-content:center;gap:20px;font-size:.68rem;color:var(--muted)}
.board-footer span{display:flex;align-items:center;gap:7px}
.dot{width:6px;height:6px;display:inline-block;background:var(--cyan);border-radius:50%}
.dot.pink{background:var(--red)}
.dot.purple{background:#ad93ff}
.panel{border:1px solid var(--line);border-radius:var(--radius);background:#10182ed9;padding:22px}
.panel h2{font-size:.9rem;margin:0 0 20px}
.controls{display:flex;flex-direction:column;gap:10px}
.controls button{width:100%;font-size:.8rem;text-align:left;padding:12px 15px}
.controls .primary{text-align:center}
.controls .divider{height:1px;background:var(--line);margin:6px 0}
.connection{margin-top:18px;padding:14px 0 0;border-top:1px solid var(--line);font-size:.75rem;line-height:1.8;color:var(--muted)}
.connection b{color:var(--lime);font-weight:400}
.history{margin-top:20px}
.history h3{font-size:.75rem;color:var(--muted);font-weight:400}
.history-row{font-size:.7rem;padding:8px 0;border-bottom:1px solid #26304c70;display:flex;justify-content:space-between;gap:10px}
.history-row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-row .ok{color:var(--lime)}
.history-row .no{color:var(--red)}
.host-note{color:var(--muted);font-size:.7rem;line-height:1.7;margin:18px 0 0}
.question{padding:20px 0 12px;text-align:center;min-height:400px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.question-top{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap}
.question h2{font-size:clamp(1.7rem,3vw,2.8rem);line-height:1.3;max-width:850px;letter-spacing:-.02em;margin:24px 0}
.countdown{position:relative;width:100px;height:100px;border-radius:50%;display:grid;place-items:center;margin:4px 0 14px;background:conic-gradient(var(--cyan) calc(var(--progress,1)*360deg),#27324d 0);padding:4px}
.countdown::before{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--bg)}
.countdown strong{position:relative;font-size:2.8rem;font-variant-numeric:tabular-nums}
.countdown.urgent{background:conic-gradient(var(--red) calc(var(--progress,1)*360deg),#27324d 0);color:var(--red)}
.timer-note{font-size:.73rem;color:var(--muted);min-height:20px}
.answer-box{border:1px dashed #455574;background:#090f22;border-radius:14px;padding:18px;text-align:left;margin-top:14px}
.answer-box .eyebrow{font-size:.65rem}
.answer-box p{font-size:1.15rem;line-height:1.5;margin:12px 0 0;color:var(--lime)}
.judge-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.judge-controls button{text-align:center}
.feedback{border:1px solid #b9f87a44;background:#b9f87a0e;border-radius:16px;padding:14px 24px;color:var(--lime);font-size:1rem;font-weight:700;margin:8px auto;animation:stamp .3s}
.feedback.wrong{color:#ff91a8;border-color:#ff527744;background:#ff527710}
.feedback p{font-size:.8rem;color:var(--muted);font-weight:400;margin-bottom:0}
.pause-overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#080d20ed;backdrop-filter:blur(12px);gap:15px}
.pause-overlay h2{font-size:2rem;margin:0}
.pause-overlay p{color:var(--muted)}
.winner{padding:30px 10px 20px;text-align:center;min-height:400px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.winner-symbol{font-size:7rem;color:var(--cyan);text-shadow:0 0 60px #37ddff66;font-weight:900;animation:winner-in .7s ease-out}
.winner.o .winner-symbol{color:var(--red);text-shadow:0 0 60px #ff527766}
.winner h2{font-size:clamp(2.5rem,5vw,4.5rem);letter-spacing:.07em;margin:8px 0;color:var(--lime)}
.winner h3{font-size:clamp(1.5rem,3vw,2.8rem);margin:14px 0;overflow-wrap:anywhere}
.winner p{color:var(--muted);font-size:.9rem}
.winner-score{font-size:1.8rem;font-weight:700;letter-spacing:.1em;margin:15px 0}
.winner-line{font-size:.75rem;color:var(--muted)}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);max-width:90vw;background:#253250;border:1px solid #455574;color:white;border-radius:12px;padding:14px 22px;opacity:0;transition:.2s;pointer-events:none;z-index:100;font-size:.85rem}
#toast.show{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
#confetti i{position:absolute;width:9px;height:18px;top:-30px;animation:fall 3.5s ease-in forwards}
.lease-notice{padding:16px;border:1px solid #ffcf6560;border-radius:12px;color:#ffe0a2;font-size:.9rem;margin-bottom:20px;line-height:1.6}
.modal-backdrop{position:fixed;inset:0;background:#040816d9;backdrop-filter:blur(8px);z-index:80;display:grid;place-items:center;padding:24px}
.modal{background:#131e35;border:1px solid #34415e;border-radius:24px;padding:30px;max-width:570px;width:100%}
.modal h2{font-size:1.6rem;margin-top:0}
.modal p,.modal li{font-size:.9rem;color:var(--muted);line-height:1.8}
.modal-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}
.display .topbar{padding:20px 36px}
.display .topbar .brand{font-size:.85rem}
.display .page{max-width:1700px;padding:24px 4vw}
.display .arena{min-height:calc(100svh - 135px);padding:24px 4vw}
.display .team-name{font-size:clamp(1rem,1.9vw,1.7rem);max-width:30vw}
.display .team-icon{font-size:3.3rem}
.display .score{font-size:3.2rem}
.display .team-sub{font-size:.8rem}
.display .board{width:min(59vh,600px)}
.display .cell .cell-number{font-size:3rem}
.display .cell .subject{font-size:clamp(.65rem,1vw,.85rem)}
.display .cell .sign{font-size:clamp(3rem,9vh,6rem)}
.display .turn-banner{font-size:1.1rem;margin:20px 0}
.display .board-footer{font-size:.8rem}
.display .question{min-height:53vh}
.display .question h2{font-size:clamp(2rem,4.1vw,4.4rem);max-width:1200px;margin:24px 0}
.display .countdown{width:130px;height:130px}
.display .countdown strong{font-size:4rem}
.display .feedback{font-size:1.5rem}
.display .question-top .pill{font-size:1rem}
.display .winner{min-height:58vh}
.display .winner h2{font-size:clamp(3rem,7vw,6.5rem)}
.display .winner-symbol{font-size:8rem}
.display .cell:disabled{opacity:1;cursor:default}
.waiting{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.waiting h1{font-size:clamp(2rem,4vw,4rem)}
.waiting p{color:var(--muted);line-height:1.8}
.waiting .mini-symbols{font-size:7rem;font-weight:900;letter-spacing:.05em}
.display .setup-preview{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:40px;width:90%;margin:25px auto}
.setup-preview .team-form{min-width:0}
.setup-preview h2{font-size:clamp(1.5rem,3vw,3rem);overflow-wrap:anywhere}
.shortcuts{color:#60718f;font-size:.65rem;letter-spacing:.04em;margin-top:16px}
.reconnect{position:fixed;bottom:12px;right:14px;color:#ffdc95;background:#392d14;border:1px solid #6d5829;padding:10px 15px;border-radius:9px;font-size:.75rem;z-index:60}
.blitz-progress{font-size:.8rem;color:var(--muted);margin-top:14px}
.blitz-progress strong{color:var(--ink)}
@keyframes stamp{0%{transform:scale(.65);opacity:.1}100%{transform:scale(1);opacity:1}}
@keyframes winner-in{0%{transform:scale(.1) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes fall{to{transform:translateY(110vh) rotate(780deg)}}
@media(min-width:1600px){
:root{font-size:19px}
.board{width:490px}
.page{max-width:1660px}
.host-layout{grid-template-columns:minmax(0,1fr) 360px}
}
@media(max-width:1000px){
.topbar{padding:20px 24px}
.page{padding:22px}
.host-layout{grid-template-columns:minmax(0,1fr) 280px;gap:16px}
.panel{padding:18px}
.arena{padding:20px}
.team-name{max-width:130px;font-size:.8rem}
.score{font-size:1.8rem}
.scoreboard{gap:12px}
.team-card{gap:8px}
.cell .subject{font-size:.52rem}
.top-actions .pill{display:none}
.board{gap:9px}
.question h2{font-size:1.8rem}
}
@media(max-width:750px){
.topbar{padding:16px}
.brand{font-size:.8rem}
.brand small{font-size:.52rem}
.top-actions button{font-size:.7rem;padding:8px 11px;min-height:38px}
.page{padding:18px 14px}
.page-head{align-items:flex-start}
.page-head h1{font-size:1.25rem}
.page-head p{font-size:.76rem}
.host-layout{grid-template-columns:1fr}
.panel{padding:20px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.controls .divider{grid-column:1/-1}
.controls button{text-align:center}
.answer-box{margin-bottom:12px}
.judge-controls{margin-bottom:14px}
.history{display:none}
.arena{padding:18px}
.board{width:min(100%,430px)}
.team-name{max-width:26vw}
.team-icon{font-size:2rem}
.team-sub{font-size:.6rem}
.score{font-size:1.8rem}
.question{min-height:360px}
.question h2{font-size:1.65rem}
.hero-symbols{margin-top:30px}
.landing{padding-top:25px}
.landing .subtitle{font-size:.7rem;letter-spacing:.04em}
.landing h1{font-size:2.8rem}
.hero-start{min-width:260px}
.hero-foot{margin-top:26px}
.hero-foot div{font-size:.65rem}
.hero-foot b{font-size:.8rem}
.teams-form{gap:12px}
.team-form{padding:22px 16px}
.team-form .big-symbol{font-size:3.5rem}
.team-form input{padding:13px 10px;font-size:.9rem}
.setup{margin:12px auto}
.setup-bottom{align-items:flex-start;flex-direction:column}
.setup-bottom .primary{width:100%}
.display .topbar{padding:15px}
.display .page{padding:12px}
.display .arena{padding:20px 14px;min-height:calc(100svh - 100px)}
.display .team-icon{font-size:2rem}
.display .score{font-size:2.1rem}
.display .team-name{font-size:.8rem}
.display .team-sub{font-size:.6rem}
.display .board{width:min(100%,59vh)}
.display .cell .cell-number{font-size:2rem}
.display .turn-banner{font-size:.9rem}
.display .board-footer{font-size:.55rem;gap:12px}
.display .question h2{font-size:1.8rem}
.display .setup-preview{gap:10px;width:100%}
.setup-preview .team-form{padding:20px 10px}
.display .setup-preview h2{font-size:1.3rem}
.display .setup-preview .versus{width:30px;height:30px;font-size:.8rem}
.display .question-top .pill{font-size:.7rem}
.display .feedback{font-size:1rem}
.modal{padding:24px}
.modal-actions{flex-direction:column}
.modal-actions button{width:100%}
}
@media(prefers-reduced-motion:reduce){
*,*::before,*::after{animation:none!important;transition:none!important}
#confetti{display:none}
}
</style>
</head>

['Физика','Күштің өлшем бірлігі қандай?','Ньютон (Н)'],
['Физика','Жылдамдықтың формуласы қандай?','v = s/t'],
['Физика','Су қалыпты атмосфералық қысымда неше градуста қайнайды?','100 °C'],
['Математика','200 санының 15%-ы неше?','30'],
['Информатика','Бір байтта неше бит бар?','8 бит'],
['Физика','Электр тогының күшін қандай құралмен өлшейді?','Амперметр'],
['Математика','Үшбұрыштың ішкі бұрыштарының қосындысы неше градус?','180°'],
['Информатика','Алгоритм деген не?','Мақсатқа жеткізетін реттелген, нақты әрекеттер тізбегі'],
['Физика','Уақыттың SI жүйесіндегі өлшем бірлігі қандай?','Секунд (с)'],
['Математика','5x = 45 болса, x неге тең?','9'],
['Информатика','Ақпаратты экранға шығаратын құрылғы қалай аталады?','Монитор'],
['Физика','Тығыздықтың формуласы қандай?','ρ = m/V'],
['Математика','Қабырғасы 7 см шаршының ауданы қанша?','49 см²'],
['Информатика','Қайталанатын әрекеттерді бағдарламалауда қалай атайды?','Цикл'],
['Физика','Кернеудің өлшем бірлігі қандай?','Вольт (В)'],
['Математика','0,5 саны жай бөлшекпен қалай жазылады?','1/2'],
['Информатика','Веб-беттің құрылымын белгілеу тілі қандай?','HTML'],
['Физика','Кедергінің өлшем бірлігі қандай?','Ом'],
['Математика','2⁵ нешеге тең?','32'],
['Информатика','Дыбысты компьютерге енгізетін құрылғы қандай?','Микрофон'],
['Физика','Массаның SI жүйесіндегі өлшем бірлігі қандай?','Килограмм (кг)'],
['Математика','Шеңбер ұзындығының формуласы қандай?','C = 2πr немесе C = πd'],
['Информатика','Зиянды сілтемемен құпия деректі алдап алу қалай аталады?','Фишинг'],
['Физика','Жүрілген жолдың бірлік уақытқа қатынасы қандай шама?','Орташа жылдамдық'],
['Математика','9 бен 12 сандарының ең үлкен ортақ бөлгіші қандай?','3'],
['Информатика','Мәтіндік файлды өңдейтін бағдарлама түрі қандай?','Мәтіндік редактор'],
['Физика','Қуаттың өлшем бірлігі қандай?','Ватт (Вт)'],
['Математика','Тік бұрыш неше градус?','90°'],
['Информатика','Логикалық «ЖӘНЕ» амалы қашан ақиқат болады?','Екі пікір де ақиқат болғанда'],
['Физика','Электр тогының күшінің өлшем бірлігі қандай?','Ампер (А)']
].map((q,id)=>({
  id,subject:q[0],text:q[1],answer:q[2]
}));

const blitz=[
['6 × 7 = ?','42'],
['8 × 9 = ?','72'],
['1 километрде неше метр бар?','1000 метр'],
['1 минутта неше секунд бар?','60 секунд'],
['10² = ?','100'],
['7² = ?','49'],
['16 санының квадрат түбірі неше?','4'],
['25 санының квадрат түбірі неше?','5'],
['Компьютерге суретті енгізетін құрылғы қандай?','Сканер'],
['Қағазға басып шығаратын құрылғы қандай?','Принтер'],
['Бір килобайтта екілік өлшемде неше байт бар?','1024 байт'],
['Екілік жүйедегі 10 саны ондық жүйеде неге тең?','2'],
['Жердің табиғи серігі қалай аталады?','Ай'],
['Температураны өлшейтін құрал қандай?','Термометр'],
['Күшті өлшейтін құрал қандай?','Динамометр'],
['Қозғалыс жылдамдығын өлшейтін құрал қандай?','Спидометр'],
['11 × 11 = ?','121'],
['12 × 12 = ?','144'],
['Үшбұрыштың неше қабырғасы бар?','3'],
['Шаршының неше симметрия осі бар?','4']
].map((q,id)=>({
  id:'b'+id,subject:'Блиц',text:q[0],answer:q[1]
}));

const lines=[
[0,1,2],[3,4,5],[6,7,8],
[0,3,6],[1,4,7],[2,5,8],
[0,4,8],[2,4,6]
];

function initial(){
  return {
    schema:1,rev:0,stage:'home',
    names:{X:'X командасы',O:'O командасы'},
    board:Array(9).fill(null),
    turn:'X',
    scores:{X:0,O:0},
    question:null,
    feedback:null,
    used:[],
    retry:0,
    paused:false,
    pausedAt:null,
    session:{remaining:900000,deadline:null},
    sound:true,
    autoTimer:true,
    winner:null,
    winningLine:[],
    reason:'',
    blitz:{index:0,answers:[],pair:1,start:'X'},
    history:[]
  };
}

function other(t){
  return t==='X'?'O':'X';
}

function left(timer,now){
  return Math.max(
    0,
    timer.deadline===null
      ?timer.remaining
      :timer.deadline-now
  );
}

function startTimer(s,now){
  if(
    s.paused||
    !s.question||
    s.feedback||
    s.question.timer.deadline!==null
  )return false;

  s.question.timer.deadline=
    now+s.question.timer.remaining;

  return true;
}

function nextQuestion(s,cell){
  let q;

  if(!s.used.includes(cell)){
    q=bank[cell];
    s.used.push(cell);
  }else{
    q=bank.find(
      item=>item.id>=9&&!s.used.includes(item.id)
    );

    if(q){
      s.used.push(q.id);
    }else{
      const n=++s.retry;
      const a=11+n;
      const b=2+n%8;

      q={
        id:'g'+n,
        subject:'Математика',
        text:`${a} × ${b} = ?`,
        answer:String(a*b)
      };
    }
  }

  return {
    ...q,
    cell,
    team:s.turn,
    timer:{remaining:10000,deadline:null}
  };
}

function blitzQuestion(s,now){
  const i=s.blitz.index;
  let q=blitz[i];

  if(!q){
    const n=i-blitz.length;

    q={
      id:'bx'+n,
      subject:'Блиц',
      text:`${13+n} + ${19+n} = ?`,
      answer:String(32+2*n)
    };
  }

  s.question={
    ...q,
    cell:null,
    team:s.turn,
    timer:{remaining:5000,deadline:null}
  };

  s.feedback=null;
  if(s.autoTimer)startTimer(s,now);
}

function finish(s,winner,reason,line=[]){
  s.winner=winner;
  s.reason=reason;
  s.winningLine=line;
  s.stage='finished';
  s.question=null;
  s.feedback=null;
  s.session.remaining=0;
  s.session.deadline=null;
  s.paused=false;
}

function enterBlitz(s,now){
  s.stage='blitz';
  s.turn=s.blitz.start;
  s.blitz.answers=[];
  blitzQuestion(s,now);
}

function endByClock(s,now){
  s.question=null;
  s.feedback=null;
  s.session.remaining=0;
  s.session.deadline=null;

  if(s.scores.X===s.scores.O){
    enterBlitz(s,now);
  }else{
    finish(
      s,
      s.scores.X>s.scores.O?'X':'O',
      '15 минут қорытындысы'
    );
  }
}

function judge(s,correct,now,timeout=false){
  if(!s.question||s.feedback||s.paused)return false;

  const q=s.question;

  if(q.timer.deadline!==null&&left(q.timer,now)===0){
    correct=false;
    timeout=true;
  }

  q.timer.remaining=left(q.timer,now);
  q.timer.deadline=null;

  if(correct)s.scores[q.team]++;

  s.feedback={correct,timeout,team:q.team};

  s.history.unshift({
    team:q.team,
    subject:q.subject,
    text:q.text,
    correct,
    timeout
  });

  s.history=s.history.slice(0,12);

  if(s.stage==='blitz'){
    s.blitz.answers.push({team:q.team,correct});
  }else if(correct){
    s.board[q.cell]=q.team;

    const line=lines.find(
      items=>items.every(i=>s.board[i]===q.team)
    );

    if(line){
      finish(s,q.team,'Үш таңба бір қатарда',line);
    }
  }

  return true;
}

function advance(s,now){
  if(!s.feedback||s.paused)return false;

  if(s.stage==='blitz'){
    if(s.blitz.answers.length===2){
      const [a,b]=s.blitz.answers;

      if(a.correct!==b.correct){
        finish(
          s,
          a.correct?a.team:b.team,
          'Блиц кезеңінің жеңімпазы'
        );
        return true;
      }

      s.blitz.answers=[];
      s.blitz.pair++;
      s.blitz.start=other(s.blitz.start);
      s.turn=s.blitz.start;
    }else{
      s.turn=other(s.turn);
    }

    s.blitz.index++;
    blitzQuestion(s,now);
    return true;
  }

  s.turn=other(s.turn);
  s.question=null;
  s.feedback=null;

  if(s.board.every(Boolean)){
    enterBlitz(s,now);
  }else if(left(s.session,now)===0){
    endByClock(s,now);
  }

  return true;
}

function pause(s,now){
  if(s.stage!=='game'&&s.stage!=='blitz')return false;

  s.paused=!s.paused;

  if(s.paused){
    s.pausedAt=now;

    for(const t of [s.session,s.question?.timer]){
      if(t&&t.deadline!==null){
        t.remaining=left(t,now);
        t.wasRunning=true;
        t.deadline=null;
      }
    }
  }else{
    for(const t of [s.session,s.question?.timer]){
      if(t?.wasRunning){
        t.deadline=now+t.remaining;
        delete t.wasRunning;
      }
    }

    s.pausedAt=null;
  }

  return true;
}

function act(state,type,payload={},now=Date.now()){
  const s=JSON.parse(JSON.stringify(state));
  let ok=true;

  switch(type){
    case 'SETUP':
      s.stage='setup';
      break;

    case 'NAMES':
      for(const t of ['X','O']){
        s.names[t]=String(payload[t]||t+' командасы')
          .trim().slice(0,28)||t+' командасы';
      }
      break;

    case 'START':
      if(s.stage!=='setup'&&s.stage!=='home')return state;
      s.stage='game';
      s.session.deadline=now+900000;
      break;

    case 'SELECT':
      if(
        s.stage!=='game'||
        s.question||
        s.paused||
        !Number.isInteger(payload.cell)||
        payload.cell<0||
        payload.cell>8||
        s.board[payload.cell]
      )return state;

      s.question=nextQuestion(s,payload.cell);
      if(s.autoTimer)startTimer(s,now);
      break;

    case 'TIMER':
      ok=startTimer(s,now);
      break;

    case 'JUDGE':
      ok=judge(s,!!payload.correct,now,!!payload.timeout);
      break;

    case 'NEXT':
      ok=advance(s,now);
      break;

    case 'PAUSE':
      ok=pause(s,now);
      break;

    case 'SOUND':
      s.sound=!s.sound;
      break;

    case 'AUTO':
      s.autoTimer=!s.autoTimer;
      break;

    case 'RESET':{
      const n=initial();
      n.names=s.names;
      n.sound=s.sound;
      n.autoTimer=s.autoTimer;
      n.stage='setup';
      n.rev=s.rev+1;
      return n;
    }

    case 'TICK':
      if(s.paused)return state;

      if(
        s.question&&
        !s.feedback&&
        s.question.timer.deadline!==null&&
        left(s.question.timer,now)===0
      ){
        judge(s,false,now,true);
      }else if(
        s.stage==='game'&&
        left(s.session,now)===0
      ){
        if(s.question&&!s.feedback){
          judge(s,false,now,true);
        }

        endByClock(s,now);
      }else{
        ok=false;
      }
      break;

    default:
      ok=false;
  }

  if(!ok)return state;
  s.rev=state.rev+1;
  return s;
}

return {initial,act,left,lines,bank,blitz,other};
});
</script>

<script>
'use strict';

(()=>{
const G=window.MIF;
const KEY='mif-battle-state-v1';
const LEASE='mif-battle-host-v1';
const CHANNEL='mif-battle-v1';

const $=s=>document.querySelector(s);
const app=$('#app');

const escape=s=>String(s).replace(
  /[&<>"']/g,
  c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c])
);

const id=window.crypto?.randomUUID?.()
  ||Math.random().toString(36).slice(2);

let mode=new URLSearchParams(location.search).get('mode')
  ||'entry';

if(!['host','display','entry'].includes(mode)){
  mode='entry';
}

let state=readState()||G.initial();
let channel=null;
let owner=false;
let storageOK=true;
let lastHost=Date.now();
let lastDisplay=0;
let lastSound='';
let lastWin='';
let lastBeep=-1;
let audio=null;
let modal=false;

try{
  localStorage.setItem('mif-storage-test','1');
  localStorage.removeItem('mif-storage-test');
}catch{
  storageOK=false;
}

try{
  channel=new BroadcastChannel(CHANNEL);
}catch{}

function read(key){
  try{
    return JSON.parse(localStorage.getItem(key));
  }catch{
    return null;
  }
}

function write(key,value){
  try{
    localStorage.setItem(key,JSON.stringify(value));
    return true;
  }catch{
    return false;
  }
}

function readState(){
  const s=read(KEY);

  return s&&s.schema===1&&
    Array.isArray(s.board)&&s.board.length===9
      ?s:null;
}

function send(data){
  try{
    channel?.postMessage({...data,sender:id});
  }catch{}
}

function lease(){
  return read(LEASE);
}

function claim(){
  if(mode!=='host')return false;

  const current=lease();

  if(
    current&&current.id!==id&&
    Date.now()-current.at<4500
  ){
    owner=false;
    return false;
  }

  owner=true;
  write(LEASE,{id,at:Date.now()});
  state=readState()||state;
  return true;
}

function publish(){
  state.updatedAt=Date.now();
  state.hostId=id;
  write(KEY,state);
  send({type:'state',state});
  lastHost=Date.now();
}

function receive(next){
  if(!next||next.schema!==1||owner)return;

  if(
    next.rev>state.rev||
    (
      next.rev===state.rev&&
      (next.updatedAt||0)>(state.updatedAt||0)
    )
  ){
    state=next;
    render();
    effects();
  }

  lastHost=Date.now();
}

if(channel){
  channel.onmessage=({data})=>{
    if(data.sender===id)return;

    if(data.type==='state')receive(data.state);

    if(data.type==='request'&&owner){
      send({type:'state',state});
    }

    if(data.type==='host')lastHost=Date.now();
    if(data.type==='display')lastDisplay=Date.now();
  };
}

window.addEventListener('storage',e=>{
  if(e.key===KEY){
    try{
      receive(JSON.parse(e.newValue));
    }catch{}
  }

  if(e.key===LEASE){
    lastHost=Date.now();

    if(owner){
      const current=lease();

      if(current&&current.id!==id){
        owner=false;
        render();
      }
    }
  }
});

window.addEventListener('pagehide',()=>{
  if(owner&&lease()?.id===id){
    try{
      localStorage.removeItem(LEASE);
    }catch{}
  }
});

function dispatch(type,payload){
  if(mode!=='host'||!owner){
    toast('Басқару үшін негізгі жүргізуші панелін пайдаланыңыз.');
    return;
  }

  unlock();

  const next=G.act(state,type,payload);

  if(next!==state){
    state=next;
    publish();
    render();
    effects();
  }
}

function toast(text){
  $('#toast').textContent=text;
  $('#toast').classList.add('show');
  clearTimeout(toast.t);

  toast.t=setTimeout(
    ()=>$('#toast').classList.remove('show'),
    4500
  );
}

function unlock(){
  try{
    if(!audio){
      audio=new(
        window.AudioContext||window.webkitAudioContext
      )();
    }

    if(audio.state==='suspended')audio.resume();
  }catch{}
}

function tone(freq,duration,start=0,volume=.07){
  if(!audio||!state.sound)return;

  const o=audio.createOscillator();
  const g=audio.createGain();

  o.type='sine';
  o.frequency.value=freq;

  g.gain.setValueAtTime(0,audio.currentTime+start);

  g.gain.linearRampToValueAtTime(
    volume,audio.currentTime+start+.012
  );

  g.gain.exponentialRampToValueAtTime(
    .0001,audio.currentTime+start+duration
  );

  o.connect(g);
  g.connect(audio.destination);

  o.start(audio.currentTime+start);
  o.stop(audio.currentTime+start+duration+.02);
}

function confetti(){
  const box=$('#confetti');
  box.replaceChildren();

  for(let i=0;i<85;i++){
    const p=document.createElement('i');

    p.style.left=Math.random()*100+'%';
    p.style.background=[
      '#37ddff','#ff5277','#b9f87a','#bba0ff'
    ][i%4];

    p.style.animationDelay=Math.random()*.8+'s';
    p.style.animationDuration=2.2+Math.random()*2+'s';

    box.append(p);
  }

  setTimeout(()=>box.replaceChildren(),5200);
}

function effects(){
  if(
    state.stage==='finished'&&
    lastWin!==state.updatedAt
  ){
    lastWin=state.updatedAt;
    confetti();

    if(owner){
      [523,659,784,1047,784,1047].forEach(
        (f,i)=>tone(f,.35,i*.16)
      );
    }
  }

  if(owner&&state.feedback){
    const key=state.rev+':'+state.feedback.correct;

    if(lastSound!==key){
      lastSound=key;

      if(state.feedback.correct){
        tone(660,.18);
        tone(880,.3,.12);
      }else{
        tone(170,.35);
      }
    }
  }
}

const btn=(action,text,cls='',disabled=false)=>`
<button
  type="button"
  data-action="${action}"
  class="${cls}"
  ${disabled?'disabled':''}
>${text}</button>`;

function topbar(){
  return `
<header class="topbar">
  <a class="brand" href="./index.html" aria-label="Басты бет">
    <span class="mark">
      <b class="cyan">X</b> <b class="red">O</b>
    </span>
    <span>
      МИФ BATTLE
      <small>БІЛІМ. ЖЫЛДАМДЫҚ. ЖЕҢІС.</small>
    </span>
  </a>
  <div class="top-actions">
    ${
      mode==='display'
      ?'<span class="pill">ИНТЕРАКТИВТІ ТАҚТА</span>'
      :mode==='host'
      ?'<span class="pill">ЖҮРГІЗУШІ ПАНЕЛІ</span>'
        +btn('display','Тақтаны ашу','small ghost')
        +btn('help','Ереже','small ghost')
      :'<span class="pill">МАТЕМАТИКА · ИНФОРМАТИКА · ФИЗИКА</span>'
        +btn('help','Қалай ойнаймыз?','small ghost')
    }
  </div>
</header>`;
}

function landing(){
  return `
<section class="landing">
  <span class="pill">
    <span class="live-dot"></span>
    МЕКТЕП АПТАЛЫҒЫНЫҢ БАСТЫ БАТТЛЫ
  </span>

  <div class="hero-symbols" aria-label="X versus O">
    <span class="hero-x">X</span>
    <span class="versus">vs</span>
    <span class="hero-o">O</span>
  </div>

  <h1>МИФ <em>BATTLE</em></h1>

  <div class="subtitle">

function render(){
  if(modal)return;

  document.body.className=mode;

  app.innerHTML=topbar()+(
    mode==='entry'
    ?landing()
    :mode==='display'
    ?displayView()
    :hostView()
  );

  updateClocks();
  updateStatus();

  if(
    mode==='host'&&!owner&&
    ['home','setup'].includes(state.stage)
  ){
    toast('Басқа жүргізуші панелі ашық. Сол терезені пайдаланыңыз.');
  }
}

function updateClocks(){
  const now=Date.now();
  const q=state.question;

  document.querySelectorAll('[data-session]').forEach(el=>{
    const v=Math.ceil(G.left(state.session,now)/1000);

    el.textContent=
      Math.floor(v/60).toString().padStart(2,'0')
      +':'+String(v%60).padStart(2,'0');
  });

  if(q){
    const ms=G.left(q.timer,now);
    const seconds=Math.ceil(ms/1000);
    const total=state.stage==='blitz'?5000:10000;

    document.querySelectorAll('[data-qtime]').forEach(
      el=>el.textContent=seconds
    );

    document.querySelectorAll('[data-countdown]').forEach(el=>{
      el.style.setProperty('--progress',ms/total);
      el.classList.toggle('urgent',seconds<=3);
    });

    const note=$('[data-timer-note]');

    if(note){
      note.textContent=state.feedback
        ?'Жауап тіркелді'
        :state.paused
        ?'Таймер кідіртілді'
        :q.timer.deadline===null
        ?'Таймердің қосылуын күтіңіз'
        :'СЕКУНД ҚАЛДЫ';
    }

    if(
      owner&&!state.paused&&!state.feedback&&
      q.timer.deadline!==null&&
      seconds<=3&&seconds>0&&lastBeep!==seconds
    ){
      lastBeep=seconds;
      tone(600,.08);
    }
  }else{
    lastBeep=-1;
  }
}

function updateStatus(){
  const b=$('[data-display-status]');

  if(b){
    b.textContent=Date.now()-lastDisplay<4500
      ?'● Тақта синхрондалды'
      :'Тақта терезесін ашыңыз';
  }

  const old=$('.reconnect');

  if(mode==='display'&&Date.now()-lastHost>5500){
    if(!old){
      const el=document.createElement('div');
      el.className='reconnect';
      el.textContent='Жүргізуші байланысын күтіп тұрмыз…';
      document.body.append(el);
    }
  }else{
    old?.remove();
  }
}

function openDisplay(){
  const url=new URL(location.href);
  url.search='?mode=display';
  url.hash='';

  const w=window.open(url.href,'mif-battle-display');

  if(!w){
    toast('Қалқымалы терезеге рұқсат беріңіз немесе ?mode=display сілтемесін жаңа терезеде ашыңыз.');
  }else{
    toast('Тақта ашылды. Терезені екінші экранға жылжытып, F11 басыңыз.');
  }
}

function switchHost(start=false){
  const url=new URL(location.href);
  url.search='?mode=host';

  history.pushState({},'',url);
  mode='host';
  claim();

  if(start&&state.stage==='home'){
    dispatch('SETUP');
  }else{
    render();
  }
}

async function fullscreen(){
  try{
    if(document.fullscreenElement){
      await document.exitFullscreen();
    }else{
      await document.documentElement.requestFullscreen();
    }
  }catch{
    toast('Толық экран үшін браузердің толық экран пәрменін пайдаланыңыз.');
  }
}

function showDialog(title,body,confirm){
  modal=true;

  const overlay=document.createElement('div');
  overlay.className='modal-backdrop';

  overlay.innerHTML=`
<section
  class="modal"
  role="dialog"
  aria-modal="true"
  aria-label="${escape(title)}"
>
  <h2>${escape(title)}</h2>
  ${body}

  <div class="modal-actions">
    ${btn(
      'close-dialog',
      confirm?'Бас тарту':'Түсінікті',
      'ghost'
    )}

    ${
      confirm
      ?btn('confirm-reset','Қайта бастау','danger')
      :''
    }
  </div>
</section>`;

  app.append(overlay);
  overlay.querySelector('button').focus();
}

function closeDialog(){
  modal=false;
  render();
}

app.addEventListener('click',e=>{
  const cell=e.target.closest('[data-cell]');

  if(cell){
    dispatch('SELECT',{cell:Number(cell.dataset.cell)});
    return;
  }

  const action=e.target.closest('[data-action]')
    ?.dataset.action;

  if(!action)return;

  switch(action){
    case 'begin':
      if(mode==='entry'){
        switchHost(true);
      }else if(state.stage==='home'){
        dispatch('SETUP');
      }else{
        render();
      }
      break;

    case 'host':
      switchHost();
      break;

    case 'display':
      openDisplay();
      break;

    case 'correct':
      dispatch('JUDGE',{correct:true});
      break;

    case 'wrong':
      dispatch('JUDGE',{correct:false});
      break;

    case 'timer':
      dispatch('TIMER');
      break;

    case 'next':
      dispatch('NEXT');
      break;

    case 'pause':
      dispatch('PAUSE');
      break;

    case 'sound':
      dispatch('SOUND');
      break;

    case 'auto':
      dispatch('AUTO');
      break;

    case 'fullscreen':
      fullscreen();
      break;

    case 'reset':
      showDialog(
        'Ойынды қайта бастаймыз ба?',
        '<p>Алаң, ұпайлар және сұрақтар тарихы тазарады. Команда атаулары сақталады.</p>',
        true
      );
      break;

    case 'confirm-reset':
      closeDialog();
      dispatch('RESET');
      break;

    case 'close-dialog':
      closeDialog();
      break;

    case 'help':
      showDialog(
        'Қалай ойнаймыз?',
        `<ol>
          <li>
            «Жүргізуші панелі» арқылы командалардың
            атын енгізіңіз.
          </li>
          <li>
            «Интерактивті тақта» терезесін екінші экранға
            жылжытып, F11 басыңыз.
            Экрандарды кеңейту режимін қолданыңыз.
          </li>
          <li>
            Жүргізуші команда таңдаған ұяшықты ашады.
            Дұрыс жауап тек жүргізушіде көрінеді.
          </li>
          <li>
            Жауапқа 10 секунд беріледі.
            Жүргізуші «Дұрыс» не «Қате» деп белгілейді.
          </li>
          <li>
            «Келесі сұрақ» кезекті ауыстырады.
            Үш таңбаны қатарға жинаған команда жеңеді.
          </li>
          <li>
            Тең ойын — блиц.
            Екі командаға 5 секундтан бір сұрақ беріледі.
            Бірі дұрыс, екіншісі қате жауап берсе,
            жеңімпаз анықталады.
          </li>
        </ol>
        <p>
          Екі терезені бір компьютердегі бір браузерде,
          бір мекенжайдан ашыңыз.
          15 минут біткенде ұпайы көп команда жеңеді.
          Ұпай тең болса, блиц басталады.
        </p>`,
        false
      );
      break;
  }
});

app.addEventListener('submit',e=>{
  if(e.target.id!=='teams')return;

  e.preventDefault();

  const data=Object.fromEntries(new FormData(e.target));

  dispatch('NAMES',data);
  dispatch('START');
});

app.addEventListener('change',e=>{
  if(owner&&e.target.closest('#teams')){
    const data=Object.fromEntries(
      new FormData($('#teams'))
    );

    state=G.act(state,'NAMES',data);
    publish();
  }
});

window.addEventListener('keydown',e=>{
  if(
    e.target.matches('input,textarea,select')||
    e.ctrlKey||e.metaKey||e.altKey
  )return;

  if(e.key==='Escape'&&modal){
    closeDialog();
    return;
  }

  if(modal)return;

  if(e.key.toLowerCase()==='f'){
    e.preventDefault();
    fullscreen();
  }

  if(mode!=='host'||!owner)return;

  if(
    e.code==='Space'&&
    ['game','blitz'].includes(state.stage)
  ){
    e.preventDefault();
    dispatch('PAUSE');
  }

  if(e.key.toLowerCase()==='m'){
    dispatch('SOUND');
  }
});

window.addEventListener('popstate',()=>location.reload());

if(mode==='host')claim();

if(owner){
  publish();
}else{
  send({type:'request'});
}

render();

if(!storageOK){
  toast('Браузер сақтау мүмкіндігін бұғаттаған. Қалыпты браузер терезесінде ашыңыз.');
}

if(location.protocol==='file:'){
  toast('Екі экранды байланыстыру үшін ойынды GitHub Pages мекенжайынан ашыңыз.');
}

setInterval(()=>{
  if(mode==='host'){
    if(owner){
      const current=lease();

      if(
        storageOK&&current?.id!==id&&current&&
        Date.now()-current.at<4500
      ){
        owner=false;
        render();
      }else{
        write(LEASE,{id,at:Date.now()});
        send({type:'host'});
      }
    }else if(claim()){
      publish();
      render();
    }
  }

  if(mode==='display'){
    send({type:'display'});
    send({type:'request'});

    const fresh=readState();
    if(fresh)receive(fresh);
  }

  updateStatus();
},1000);

setInterval(()=>{
  if(owner){
    const next=G.act(state,'TICK');

    if(next!==state){
      state=next;
      publish();
      render();
      effects();
    }
  }

  updateClocks();
},100);

})();
</script>
</body>
</html>
